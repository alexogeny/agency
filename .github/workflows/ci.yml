name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            curl \
            fish \
            fontconfig \
            poppler-utils \
            xz-utils

      - name: Restore report fonts
        id: report-fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/fonts/cm-unicode
            ~/.local/share/licenses/cm-unicode
          key: report-fonts-${{ runner.os }}-cm-unicode-0.7.0-2609c144

      - name: Install report fonts
        if: steps.report-fonts.outputs.cache-hit != 'true'
        run: ./scripts/install-report-fonts.sh

      - name: Refresh font cache
        run: fc-cache -f ~/.local/share/fonts/cm-unicode

      - name: Check Bash syntax
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git grep -l '^#!/usr/bin/env bash')

      - name: Exercise installer plan
        run: ./install.sh --dry-run

      - name: Run tests
        env:
          AGENCY_TEST_SCRATCH: ${{ runner.temp }}/agency-tests
        run: python -m unittest discover -s Tests -v
